<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="description" content="Lumécho, le jeu où ton passé joue ta musique : démo gratuite. Jeu complet sur Google Play.">
<meta property="og:title" content="Lumécho · CosmoPixelGames">
<meta property="og:description" content="Chaque trajet devient un écho qui le rejoue. Évite ton passé, joue la musique.">
<meta property="og:image" content="https://cosmopixelgames.com/lumecho/partage.png">
<meta property="og:url" content="https://cosmopixelgames.com/lumecho/">
<meta name="twitter:card" content="summary_large_image">
<title>Lumécho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout : une arène-instrument circulaire au centre d'un champ noir ; l'interface reste au bord, comme les graduations d'un cadran. */
:root{
  --void:#05060f; --ink:#eef0ff; --muted:#8b91bd; --line:rgba(160,170,255,.18);
  --panel:rgba(6,8,22,.82); --accent:#6fe7ff; --accent-glow:rgba(111,231,255,.35);
  --gold:#ffd76a; --danger:#ff5e7a; --echo:#ff4fd8; --echo2:#ff9f43; --scrim:rgba(5,6,15,.62);
  --f-display:"Avenir Next","Futura","Century Gothic","Josefin Sans","Trebuchet MS",system-ui,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 18px);
  transition:opacity .45s ease,visibility .45s}
.off{opacity:0;visibility:hidden;pointer-events:none}

/* Titre */
#title{justify-content:space-between}
.top{text-align:center;margin-top:2vh}
.logo{margin:0;white-space:nowrap;font-family:var(--f-display);font-weight:300;font-size:clamp(32px,11vw,70px);letter-spacing:.22em;padding-left:.22em;
  background:linear-gradient(180deg,var(--ink) 35%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:10px 0 0;color:var(--muted);font-size:14px;letter-spacing:.05em}
.bottom{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.themes{display:flex;align-items:center;gap:10px}
.arrow{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:22px;line-height:1}
.arrow:disabled{opacity:.3}
.theme-name{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:3px}
.theme-name b{font-family:var(--f-display);font-weight:400;letter-spacing:.24em;text-transform:uppercase;font-size:15px}
.theme-name small{color:var(--muted);font-size:12px}
.btn{border:0;border-radius:999px;padding:16px 20px;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  background:var(--accent);color:var(--void);box-shadow:0 0 28px var(--accent-glow);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:500}
.daily{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 18px;letter-spacing:.12em;font-size:14px}
.daily em{font-style:normal;color:var(--gold)}
.daily small{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--muted);font-weight:400}
.stats{color:var(--muted);font-size:12px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 11px;font-size:12px;letter-spacing:.03em;color:var(--ink)}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent)}
.chip.code{color:var(--gold);border-color:var(--gold)}
.demo-chip{display:inline-block;margin-top:10px;padding:5px 12px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-size:12px;letter-spacing:.04em;text-decoration:none}
.demo-chip[hidden]{display:none}
.btn.ghost.gold{border-color:var(--gold);color:var(--gold)}
.foot{font-size:10px;color:var(--muted);letter-spacing:.3em;text-transform:uppercase;opacity:.55;text-align:center}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .4s}
.cyc{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding-top:6px}
#dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;max-width:150px}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--muted);box-sizing:border-box}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.ob{width:9px;height:9px;margin-top:-1px;border:2px solid var(--ink)}
.hc{text-align:center}
#score{font-family:var(--f-num);font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1;transition:transform .15s}
#score.pop{transform:scale(1.12)}
#combo{color:var(--gold);font-size:13px;letter-spacing:.14em;min-height:17px}
.hr{display:flex;justify-content:flex-end}
#pauseBtn{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(5,6,15,.5);font-size:13px;letter-spacing:.05em}
#hint{position:fixed;left:0;right:0;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);text-align:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-size:15px;line-height:1.4;text-wrap:balance;opacity:0;transition:opacity .4s;text-shadow:0 1px 10px var(--void)}
#hint.show{opacity:.95}
#banner{position:fixed;left:0;right:0;top:19%;z-index:4;text-align:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;display:flex;flex-direction:column;gap:6px}
#banner.show{opacity:1;transform:none}
#banner b{font-family:var(--f-display);font-weight:300;font-size:30px;letter-spacing:.3em;padding-left:.3em}
#banner small{color:var(--muted);font-size:13px;letter-spacing:.06em}

/* Cartes pause / fin */
#over{justify-content:flex-end}
#pause{justify-content:center;background:rgba(5,6,15,.55)}
.card{width:100%;max-width:380px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-num);font-size:54px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.badge{align-self:center;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--void);background:var(--gold);padding:5px 12px;border-radius:999px}
.quote{margin:0;font-style:italic;font-size:14px;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid div{display:flex;flex-direction:column;gap:3px}
.grid b{font-family:var(--f-num);font-size:18px;font-weight:400;font-variant-numeric:tabular-nums}
.grid span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.prog b{color:var(--ink);font-weight:500}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 1s ease .3s}
.row2{display:grid;grid-template-columns:2fr minmax(max-content,1fr);gap:10px}.row2 .btn{white-space:nowrap}
.small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* v2 : aide, code ami, partage, rang */
.link{margin-top:8px;border:0;background:none;color:var(--accent);font-size:13px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
.scroll{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--scrim)}
.scroll>.card{margin-block:auto}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;text-align:left}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.steps svg{width:44px;height:44px}
.steps p,.lead{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.steps b{color:var(--ink);font-weight:600}
.code-in{font:500 19px var(--f-num);letter-spacing:.12em;text-align:center;text-transform:uppercase;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto;width:100%;box-sizing:border-box}
.code-in:focus{outline:2px solid var(--accent);outline-offset:2px}
.code-in::placeholder{color:var(--muted);opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#shareImg{display:block;width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:var(--void)}
#shareTxt{margin:0;white-space:pre-wrap;word-break:break-word;text-align:left;font:12px/1.5 var(--f-num);color:var(--muted);background:rgba(255,255,255,.04);
  border-radius:10px;padding:10px 12px;-webkit-user-select:text;user-select:text;max-height:110px;overflow:auto}
.row3{display:flex;gap:10px}.row3>*{flex:1;min-width:0}
.rank{margin-top:-4px;font-size:12px;font-weight:600;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase;color:var(--gold)}
.tgt{margin-top:7px;font-size:11px;letter-spacing:.08em;color:var(--gold);font-variant-numeric:tabular-nums}
.btn.slim{padding:12px 16px;font-size:12px;letter-spacing:.14em}
.badge.ghosty{background:transparent;color:var(--gold);border:1px solid var(--gold)}
/* v3 : mondes, Zen, musicothèque, partition */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 10px;min-width:0;font-size:13px;letter-spacing:.14em}
.duo small{max-width:100%;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.3;text-align:center;font-size:11px;letter-spacing:.03em;text-transform:none;color:var(--muted);font-weight:400}
.duo em{font-style:normal;color:var(--gold)}
.btn:disabled{opacity:.4;box-shadow:none}
#song{position:fixed;left:0;right:0;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:12px;letter-spacing:.05em;color:var(--muted);transition:opacity .4s}
#song .bar{width:min(220px,60vw);height:3px}
#song .bar i{background:var(--gold);transition:width .3s ease}
.mlist{display:flex;flex-direction:column;gap:6px;text-align:left}
.mw{margin-top:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;text-align:left;width:100%;box-sizing:border-box}
.mrow span{display:flex;flex-direction:column;gap:2px;min-width:0}
.mrow b{font-weight:600;font-size:14px}
.mrow small{font-size:11px;color:var(--muted)}
.mrow em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.mrow.done{border-color:var(--gold)}
.mrow.done em{color:var(--gold)}
.mrow.go em{color:var(--accent)}
.save-box{display:contents}
.save-msg{margin:0;text-align:center;line-height:1.45;max-width:34em;align-self:center}
.gold{color:var(--gold)}
/* Réglages, plein écran */
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.langs .chip{padding:10px 8px}
.langs .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.chip.icon{display:inline-flex;align-items:center;justify-content:center;padding:7px 10px}
/* Retour, à propos */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:9;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:13px;white-space:nowrap;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
button.foot{border:0;background:none;align-self:center;padding:6px 10px}
.sel{-webkit-user-select:text;user-select:text;color:var(--ink)}
.lnk{color:var(--accent)}
#credits{line-height:1.6;text-align:left}
/* Paysage (tablette, ordinateur, téléphone couché) : arène à gauche ou au centre, interface sur les côtés */
.land #title{display:grid;grid-template-columns:1fr minmax(300px,400px);grid-template-rows:auto auto;align-content:center;column-gap:24px;row-gap:12px;overflow-y:auto}
.land #title .top,.land #title .bottom{grid-column:2;width:100%;max-width:none}
.land #title .top{margin-top:0}
.land .logo{font-size:clamp(22px,7vh,44px)}
.land #hud{grid-template-columns:auto 1fr auto}
.land #hud .hl{grid-column:1;grid-row:1}
.land #hud .hc{grid-column:1;grid-row:2;text-align:left;margin-top:8px}
.land #hud .hr{grid-column:3;grid-row:1}
.land #song{right:auto;align-items:flex-start}
.land #hint{left:auto;width:min(34vw,360px);text-align:right;bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.land #over{align-items:flex-end;justify-content:flex-start;overflow-y:auto}
.land #over .card{margin-block:auto}
.land #banner{top:10%}
@media (max-height:440px){.land #title{row-gap:6px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px)}
  .land #title .bottom{gap:8px}.land .tag{margin-top:4px}.land .demo-chip{margin-top:6px;padding:3px 10px}.land #title .btn{padding-block:11px}.land #title .duo .btn{padding-block:8px}}
@media (max-height:700px){.card{gap:9px;padding:16px}.big{font-size:44px}.quote{font-size:13px}.btn{padding:13px 18px}}
/* Téléphones courts en portrait : on resserre le menu pour laisser de la place à l'arène */
@media (max-height:780px){html:not(.land) .top{margin-top:0}html:not(.land) .tag{margin-top:6px}html:not(.land) .link{margin-top:2px}
  html:not(.land) #title .bottom{gap:8px}html:not(.land) .duo .btn{padding-block:8px}}
@media (max-width:380px){.duo .btn{letter-spacing:.06em}.chip{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.screen,#banner,#hint,.bar i,#score{transition:none}}
@media (min-height:760px){.card{gap:14px;padding:24px}}
/* Écritures japonaise, coréenne et chinoise : pas d'espacement large entre les signes, coupures de ligne propres */
:lang(ja) :is(.btn,.kicker,.cyc,.foot,.rank,.badge,.mw,.grid span,.theme-name b,#banner b,#combo,.daily),
:lang(ko) :is(.btn,.kicker,.cyc,.foot,.rank,.badge,.mw,.grid span,.theme-name b,#banner b,#combo,.daily),
:lang(zh) :is(.btn,.kicker,.cyc,.foot,.rank,.badge,.mw,.grid span,.theme-name b,#banner b,#combo,.daily){letter-spacing:.06em}
:lang(ja) body,:lang(zh) body{line-break:strict}
:lang(ko) body{word-break:keep-all;overflow-wrap:break-word}
</style>
</head>
<body>
<canvas id="c" data-ta="arena" aria-label="Arène de jeu"></canvas>

<div id="hud" class="off" aria-live="polite">
  <div class="hl"><div class="cyc" id="cycLabel">Cycle 1</div><div id="dots"></div><div class="tgt" id="target" hidden></div></div>
  <div class="hc"><div id="score">0</div><div id="combo"></div></div>
  <div class="hr"><button id="pauseBtn" data-ta="pauseA" aria-label="Pause">II</button></div>
</div>
<div id="hint" role="status"></div>
<div id="song" class="off"><span id="songT"></span><div class="bar"><i id="songBar"></i></div></div>
<div id="banner"><b id="banT">CYCLE 2</b><small id="banS"></small></div>
<div id="toast" role="status"></div>

<section id="title" class="screen">
  <div class="top">
    <h1 class="logo">LUMÉCHO</h1>
    <a class="demo-chip" id="demoLink" hidden target="_blank" rel="noopener" data-t="demoBadge"></a>
    <p class="tag" id="tagline"></p>
    <button class="link" id="btnHelp" data-t="howq"></button>
  </div>
  <div class="bottom">
    <div class="themes">
      <button class="arrow" id="thPrev" data-ta="prevW" aria-label="‹">‹</button>
      <div class="theme-name"><b id="thName"></b><small id="thInfo"></small></div>
      <button class="arrow" id="thNext" data-ta="nextW" aria-label="›">›</button>
    </div>
    <button class="btn" id="btnPlay"></button>
    <div class="duo">
      <button class="btn ghost" id="btnZen"><span data-t="zen"></span><small data-t="zenSub"></small></button>
      <button class="btn ghost" id="btnDaily"><span data-t="daily"></span><small><em id="dMod"></em></small></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="row">
      <button class="chip" id="btnMusic" data-t="music"></button>
      <button class="chip code" id="btnCode" data-t="friend"></button>
      <button class="chip icon" id="btnSettings" data-ta="settings" aria-label="⚙"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10.4 4.9 L10.7 1.9 L13.3 1.9 L13.6 4.9 L15.9 5.8 L18.2 3.9 L20.1 5.8 L18.2 8.1 L19.1 10.4 L22.1 10.7 L22.1 13.3 L19.1 13.6 L18.2 15.9 L20.1 18.2 L18.2 20.1 L15.9 18.2 L13.6 19.1 L13.3 22.1 L10.7 22.1 L10.4 19.1 L8.1 18.2 L5.8 20.1 L3.9 18.2 L5.8 15.9 L4.9 13.6 L1.9 13.3 L1.9 10.7 L4.9 10.4 L5.8 8.1 L3.9 5.8 L5.8 3.9 L8.1 5.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></button>
      <button class="chip icon" id="btnFs" data-ta="fs" aria-label="⛶" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <button class="foot" id="btnAbout">CosmoPixelGames · <span data-t="about"></span></button>
  </div>
</section>

<section id="settings" class="screen scroll off">
  <div class="card">
    <div class="kicker" data-t="settings"></div>
    <div class="small" data-t="lang"></div>
    <div class="langs" id="langs"></div>
    <div class="row">
      <button class="chip" id="tgSound" aria-pressed="true" data-t="sound"></button>
      <button class="chip" id="tgHaptic" aria-pressed="true" data-t="vib"></button>
    </div>
    <div class="save-box" id="saveBox">
      <div class="small" data-t="saveT"></div>
      <div class="row">
        <button class="chip" id="btnExport" data-t="exp"></button>
        <button class="chip" id="btnImport" data-t="imp"></button>
      </div>
      <p class="small save-msg" id="saveMsg"></p>
      <input type="file" id="importFile" hidden>
    </div>
    <button class="btn ghost slim" id="btnSetClose" data-t="back"></button>
  </div>
</section>

<section id="help" class="screen scroll off">
  <div class="card">
    <div class="kicker" data-t="how"></div>

const WBITS = 5, WMASK = 31;
const B32 = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  const mul = echoMul(), cd = collDist(), nd = nearDist(), prism = rule('prisme');

    const e = G.echoes[i];
    advanceEcho(e, mul, true);
    e.pwx = e.wx; e.pwy = e.wy;
    e.wx = e.bx * G.rc - e.by * G.rs; e.wy = e.bx * G.rs + e.by * G.rc;
    const jumped = isJump(e.pwx, e.pwy, e.wx, e.wy);
    if (jumped && e.fade === 0) { addRipple(e.pwx, e.pwy, e.color, 0.12); addRipple(e.wx, e.wy, e.color, 0.12); }
    if (e.fade >= 1) { G.echoes.splice(i, 1); continue; }
    if (e.grace > 0) { e.grace -= TICK; continue; }
    if (e.fade > 0 || e.harmless || e.born < 0.35) continue;
    const d = hyp(e.wx - P.x, e.wy - P.y);
    if (G.zen) { // en Zen, toucher un écho joue sa note
      if (d < cd * 1.3) { if (e.armed) { e.armed = false; zenTouch(e); } }
      else if (d > cd * 2) e.armed = true;
      continue;
    }
    if (prism && e.prism === G.prism) { // Prisme : un écho de ta couleur se traverse
      if (d < cd * 1.2) { if (e.armed) { e.armed = false; if (G.nearThisStar < 3) crossPrism(e); } }
      else if (d > nd) e.armed = true;
      continue;
    }
    const dm = jumped ? 9 : hyp((e.wx + e.pwx - P.x - P.px) / 2, (e.wy + e.pwy - P.y - P.py) / 2);
    if (d < cd || dm < cd) { die(e); return; }
    if (d < nd) { if (e.armed) { e.armed = false; if (G.nearThisStar < 3) nearMiss(e); } }
    else if (d > nd * 1.5) e.armed = true;
  }
  if (G.wave) {
    const w = G.wave; w.r += 2.6 * TICK;
    for (const e of G.echoes) if (e.fade === 0 && hyp(e.wx - w.x, e.wy - w.y) < w.r) { e.fade = 0.001; burst(e.wx, e.wy, e.color, 14, 0.7); }
    if (w.r > 2.4) G.wave = null;
  }
  if (G.starTimer > 0) { G.starTimer -= TICK; if (G.starTimer <= 0) spawnStar(); }
  else if (G.star) {
    const s = G.star;
    s.age += TICK;
    if (s.mv) moveStar(s);
    const w = toWorld(s.x, s.y);
    if (hyp(w[0] - P.x, w[1] - P.y) < PLAYER_R + STAR_R) collectStar();
  }
  if (G.tutoStep === 0 && G.moved > 0.35) { hint(T('t2'), 0); G.tutoStep = 1; }
}

// L'ombre : elle refait ton chemin avec SH_N pas de retard, dès la première étoile attrapée.
function tickShadow() {
  const P = G.P, h = G.hist, sh = G.shadow;
  h[G.histI * 2] = P.x; h[G.histI * 2 + 1] = P.y;
  G.histI = (G.histI + 1) % SH_N; G.histN = Math.min(SH_N, G.histN + 1);
  if (G.stars < 1 || G.histN < SH_N) return false;
  const sx = h[G.histI * 2], sy = h[G.histI * 2 + 1]; // la plus ancienne position gardée
  if (!sh.on) { sh.on = true; sh.born = 0; sh.armed = true; burst(sx, sy, SH_COL, 14, 0.5); }
  sh.x = sx; sh.y = sy; sh.born = Math.min(1, sh.born + TICK * 2.5);
  const d = hyp(sx - P.x, sy - P.y);
  if (sh.born >= 0.6 && d < collDist() * 0.95) { die({ color: SH_COL, shadow: true }); return true; }
  if (d < nearDist()) { if (sh.armed) { sh.armed = false; if (G.nearThisStar < 3) nearMiss({ color: SH_COL, wx: sx, wy: sy }); } }
  else if (d > nearDist() * 1.5) sh.armed = true;
  return false;
}

function tickAmbient(mul) {
  if (G.rule === 'maree' || G.sc !== 1) frameRule(TICK, true);
  for (let i = G.echoes.length - 1; i >= 0; i--) {
    const e = G.echoes[i];
    advanceEcho(e, mul, 'quiet');
    if (e.fade >= 1) G.echoes.splice(i, 1);
  }
}
function tickDying() {
  G.deathT += TICK;
  tickAmbient(echoMul() * 0.45);
  if (G.deathT > 1.15) gameOver();
}

// Position suivante tirée de la graine uniquement (jamais du joueur) : la suite est identique pour tous.
function nextStarPos() {
  const p = G.lastStar, sun = rule('soleil'), por = G.portals;
  for (let i = 0; i < 40; i++) {
    const a = G.seq() * TAU, rr = Math.sqrt(G.seq()) * 0.8, x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    const d = hyp(x - p.x, y - p.y);
    if (por.length && por.some(q => hyp(x - q.x, y - q.y) < PORT_R + STAR_R + 0.06)) continue;
    if (d >= 0.5 && d <= 1.4 && (!sun || rr > 0.32)) return { x, y };
  }
  return { x: p.x ? -p.x * 0.8 : 0.5, y: -p.y * 0.8 };
}
function spawnStar() {
  const P = G.P, oubli = G.inCycle === cycleLen() - 1, c = nextStarPos(), q = toRec(P.x, P.y);
  G.lastStar = c;
  const s = G.star = { x: c.x, y: c.y, oubli, age: 0, window: 1, path: [] };
  if (rule('etoile')) { // l'étoile du berger se promène (trajet tiré de la graine : le même pour tous)
    Object.assign(s, { mv: true, bx: c.x, by: c.y, amp: 0.12 + G.seq() * 0.12, fx: 1 + G.seq() * 0.8, fy: 1 + G.seq() * 0.8,
      ph: G.seq() * TAU, pv: G.seq() * TAU });
    moveStar(s);
  }
  const w = toWorld(s.x, s.y);
  s.window = 1.0 + hyp(w[0] - P.x, w[1] - P.y) * 1.25 + (s.mv ? 0.6 : 0);
  G.recX = [q[0]]; G.recY = [q[1]]; G.recording = true;
  G.nearThisStar = 0;
  addRipple(w[0], w[1], oubli ? '#ffffff' : theme.star, 0.2);
  if (oubli && !G.tutoOubli && G.cycle === 1 && !store.tuto) { G.tutoOubli = true; hint(T('t6'), 4); }
  updateHUD();
}
function moveStar(s) {
  let x = s.bx + s.amp * Math.sin(s.fx * s.age + s.ph), y = s.by + s.amp * Math.sin(s.fy * s.age + s.pv);
  const r = hyp(x, y); if (r > 0.86) { x *= 0.86 / r; y *= 0.86 / r; }
  s.x = x; s.y = y;
  s.path.push(x, y); if (s.path.length > 24) s.path.splice(0, 2);
}

function collectStar() {
  const s = G.star, w = toWorld(s.x, s.y);
  G.star = null;
  G.combo = s.age <= s.window ? Math.min(G.combo + 1, 9) : 1;
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  G.stars++; G.inCycle++;
  burst(w[0], w[1], s.oubli ? '#ffffff' : theme.star, 26, 0.9);
  addRipple(w[0], w[1], s.oubli ? '#ffffff' : theme.star, 0.35);
  if (s.oubli) { forget(w); return; }
  G.log += '✦';
  // La note suivante du morceau ; ses accords guident les échos.
  const i = G.noteIdx;
  G.chord = CH[G.song.chords[i]];
  sfxMelody(G.song.notes[i], w[0]);
  G.noteIdx++;
  const pts = 10 * G.combo;
  addScore(pts);
  floatText('+' + pts, w[0], w[1] - 0.09, theme.star, 17);
  buzz(12);
  // En rythme : étoile attrapée pile sur un temps (à 90 ms près) ; les bonus s'enchaînent jusqu'à ×5.
  if (beatOff() < 0.09) {
    G.rhythm++; G.rStreak = Math.min(G.rStreak + 1, 5);
    const rb = G.zen ? 0 : 10 * G.combo * G.rStreak;
    if (rb) addScore(rb);
    floatText(T('rhy') + (G.rStreak > 1 ? ' ×' + G.rStreak : '') + (rb ? ' +' + rb : ''), w[0], w[1] + 0.1, theme.ring, 14);
    addRipple(w[0], w[1], theme.ring, 0.5); sfxRhythm(G.rStreak);
  } else G.rStreak = 0;
  if (!store.rhyHint && G.stars === 4 && !G.zen) { hint(T('t7'), 4.5); store.rhyHint = true; saveStore(); }
  const prism = rule('prisme');
  if (G.recX.length > 2) {
    const xs = Float32Array.from(G.recX), ys = Float32Array.from(G.recY);
    const col = prism ? PRISM[G.prism] : theme.echo[G.echoCount % theme.echo.length];
    G.echoCount++;
    const e = makeEcho(xs, ys, col);
    if (prism) e.prism = G.prism;
    G.echoes.push(e); G.runPaths.push(e);
    if (rule('miroir')) {
      const tw = makeEcho(xs.map(v => -v), ys.map(v => -v), col);
      tw.grace = 1; tw.silent = true; G.echoes.push(tw); G.runPaths.push(tw);
    }
    if (G.stars === 1 && G.tutoStep < 99) { G.firstEcho = e; G.firstEchoT = G.time; }
  }
  if (prism) { // nouvelle couleur ; un écho que tu traversais au même instant te laisse le temps d'en sortir
    G.prism = (G.prism + 1) % PRISM.length;
    for (const e of G.echoes) if (e.fade === 0 && hyp(e.wx - G.P.x, e.wy - G.P.y) < collDist() * 1.8) e.grace = Math.max(e.grace, 0.6);
    burst(G.P.x, G.P.y, PRISM[G.prism], 18, 0.7); addRipple(G.P.x, G.P.y, PRISM[G.prism], 0.3);
  }
  G.recording = false;
  if (G.tutoStep < 99) {
    if (G.stars === 1) { hints([[T('t3'), 3.8], [T('t4'), 4.2]]); G.tutoStep = 2; }
    else if (G.stars === 3) { hint(T('t5'), 3.2); G.tutoStep = 3; }
  }
  if (G.noteIdx >= G.song.notes.length) songDone();
  spawnStar();
}

function songDone() {
  // Un morceau se gagne seulement là où l'on peut perdre : Jouer, défi du jour, code ami. Pas en Zen.
  const s = G.song, gagne = !G.zen, first = gagne && !store.done[s.id];
  G.songsDone.push(s);
  if (gagne) { store.done[s.id] = true; saveStore(); }
  const pts = G.zen ? 0 : 250 * Math.max(1, Math.floor(G.combo / 2));
  if (pts) addScore(pts);
  const titre = first ? T('bSongNew', songTitle(s)) : store.done[s.id] ? songTitle(s) : T('bSongZen', songTitle(s));
  showBanner(T('bSong'), titre + (pts ? ' · +' + pts : ''));
  sfxSongDone(); buzz([20, 30, 20, 30, 40]);
  for (let i = 0; i < 4; i++) { const a = Math.random() * TAU; burst(Math.cos(a) * 0.5, Math.sin(a) * 0.5, theme.star, 16, 0.8); }
  const list = G.daily ? songPool() : G.world.songs.map(songById);
  G.song = list[(list.indexOf(s) + 1) % list.length]; G.noteIdx = 0;
}

function forget(w) {
  const n = G.echoes.length, pts = (50 + 20 * n) * G.combo;
  G.log += '◎ ';
  addScore(pts);
  floatText(T('forget', pts), w[0], w[1] - 0.1, '#ffffff', 21);
  sfxForget(); buzz([20, 40, 30]);
  for (const e of G.echoes) e.harmless = true;
  G.wave = { x: w[0], y: w[1], r: 0 };
  flash('#ffffff', 0.28); shake(7);
  G.recording = false;
  G.cycle++; G.inCycle = 0; G.starTimer = 1.5;
  if (G.shadow.on) burst(G.shadow.x, G.shadow.y, SH_COL, 16, 0.6);
  const prev = G.rule;
  G.rule = ruleFor(G.world, G.cycle);
  enterRule(prev); // l'ombre repart de zéro, Supernova change de règle…
  const nova = G.world.rule === 'supernova';
  showBanner(T('bCycle', G.cycle), nova ? ruleLine() : T('cl' + ((G.cycle - 2) % 7)));
  if (nova && prev !== G.rule) { flash(theme.star, 0.22); addRipple(0, 0, theme.star, 1.2); }
  if (!store.tuto) { store.tuto = true; saveStore(); G.tutoStep = 99; }
  updateHUD();
}

function nearMiss(e) {
  G.near++; G.nearThisStar++;
  const pts = 5 * G.combo;
  addScore(pts);
  floatText(T('near', pts), G.P.x, G.P.y - 0.11, e.color, 14);
  sfxNear(G.P.x); buzz(8);
  burst((e.wx + G.P.x) / 2, (e.wy + G.P.y) / 2, e.color, 8, 0.4);
}
// Prisme : traverser un écho de sa couleur rapporte autant qu'un frôlement.
function crossPrism(e) {
  G.near++; G.nearThisStar++;
  const pts = 5 * G.combo;
  addScore(pts);
  floatText(T('thru', pts), G.P.x, G.P.y - 0.11, e.color, 14);
  sfxNear(G.P.x); buzz(6);
  burst(G.P.x, G.P.y, e.color, 10, 0.5);
}
function portalFx(a, b) {
  burst(a.x, a.y, '#36f1ff', 16, 0.7); burst(b.x, b.y, '#ff8a3d', 16, 0.7);
  addRipple(a.x, a.y, '#36f1ff', 0.25); addRipple(b.x, b.y, '#ff8a3d', 0.25);
  const ch = G.chord;
  pluck(84 + ch[0], 0.16, a.x * 0.6, 0, 0.5); pluck(96 + ch[1 % ch.length], 0.12, b.x * 0.6, 0.06, 0.6);
  buzz(10);
}
function zenTouch(e) {
  playQ(chordNote(e.deg, e.inner), 0.34, e.wx * 0.7, 1.4, null);
  burst(e.wx, e.wy, e.color, 8, 0.4); addRipple(e.wx, e.wy, e.color, 0.12); buzz(6);
}

function die(e) {
  const P = G.P;
  P.alive = false; G.hitstop = 0.16; G.deathT = 0; G.killer = e;
  G.log += '✕';
  shake(16); flash(e.color, 0.35);
  burst(P.x, P.y, theme.player, 46, 1.1); burst(P.x, P.y, e.color, 22, 0.8);
  addRipple(P.x, P.y, e.color, 0.5);
  sfxDeath(); buzz([50, 40, 90]);
  hint('', 0);
  setMode('dying');
}

// Une phrase de fin propre à certains mondes (une fois sur deux environ).
const DEATH_W = { glacier: 'dIce', maree: 'dTide', portails: 'dPortal', envers: 'dFlip', prisme: 'dPrism', supernova: 'dNova', halloween: 'dHw', noel: 'dXmas' };
function gameOver() {
  const was = WORLDS.map((w, i) => unlocked(i)), wi = WORLDS.indexOf(G.world), ws = wstat(G.world.id);
  const counts = !G.daily && (G.kind !== 'friend' || was[wi]);
  const prev = G.daily ? store.daily.best : ws.best, rec = G.score > prev && G.score > 0 && (G.daily || counts);
  if (G.daily) { if (rec) store.daily.best = G.score; }
  else if (counts) { if (rec) ws.best = G.score; ws.maxCycle = Math.max(ws.maxCycle, G.cycle); }
  store.best = Math.max(store.best, G.score);
  store.lifeStars += G.stars; store.games++;
  store.maxCycle = Math.max(store.maxCycle, G.cycle);
  store.tuto = true;
  saveStore();
  const idx = G.echoes.indexOf(G.killer);
  let line = T('d' + Math.floor(Math.random() * 5));
  if (idx >= 0 && idx === G.echoes.length - 1) line = T('dLast');
  else if (idx === 0 && G.echoes.length > 2) line = T('dFirst');
  const dw = DEATH_W[G.world.id];
  if (dw && Math.random() < (G.world.event ? 0.6 : 0.45)) line = T(dw);
  if (G.killer && G.killer.sun) line = T('dSun');
  if (G.killer && G.killer.shadow) line = T('dShadow');
  if (G.quit) line = T('dQuit');
  const friend = G.kind === 'friend' && G.target > 0 ? { target: G.target, won: G.score > G.target } : null;
  showOver(rec, WORLDS.filter((w, i) => !was[i] && unlocked(i)), line, friend);
  setMode('over');
}

/* ---------- Écran titre : échos de démonstration ---------- */
function synthPath(r) {
  let x = (r() * 2 - 1) * 0.5, y = (r() * 2 - 1) * 0.5, h = r() * TAU;
  const n = 110 + Math.floor(r() * 150), xs = new Float32Array(n), ys = new Float32Array(n), sp = (0.9 + r() * 0.6) * TICK;
  for (let i = 0; i < n; i++) {
    h += (r() - 0.5) * 0.16;
    if (hyp(x, y) > 0.7) { const dh = ((Math.atan2(-y, -x) - h + Math.PI * 3) % TAU) - Math.PI; h += dh * 0.08; }
    x += Math.cos(h) * sp; y += Math.sin(h) * sp;
    xs[i] = x; ys[i] = y;
  }
  return [xs, ys];
}
function attract() {
  G.echoes = []; G.world = theme; G.rule = ruleFor(theme, 1); G.rot = 0; G.sc = 1; G.mt = 0; G.rc = 1; G.rs = 0; G.sunIn = 1;
  G.portals = G.rule === 'portail' ? portalsFor(7 << WBITS) : []; G.shadow.on = false;
  const r = mulberry32((Math.random() * 1e9) | 0);
  for (let i = 0; i < 6; i++) {
    const p = synthPath(r), e = makeEcho(p[0], p[1], theme.echo[i % theme.echo.length]);
    e.t = r() * (e.n - 1); e.born = 1; G.echoes.push(e);
  }
}

/* ==========================================================
   Rendu Canvas 2D (lueurs pré-calculées, aucun shadowBlur)
   ========================================================== */
const cvs = $('c'), ctx = cvs.getContext('2d');
const FONT_UI = 'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
let W = 0, H = 0, DPR = 1, R = 100, CX = 0, CY = 0, bgCan = null, realTime = 0, shownScore = 0;
const sprites = new Map(), parts = [], ripples = [], floats = [], vq = [];
// Effet visuel différé (pour s'allumer pile avec une note calée sur le tempo).
function visualAt(delay, fn) { vq.push({ t: realTime + delay, fn }); }
let shakeAmt = 0, shX = 0, shY = 0, flashC = '#ffffff', flashA = 0;
let frameDt = 0; // durée de la dernière image (neige)

// Deux mises en page : au menu, l'arène se loge entre le logo et les boutons ; en jeu, elle prend toute la place.
const LAY = { play: { R: 100, CX: 0, CY: 0 }, title: { R: 100, CX: 0, CY: 0 } };
let isLand = false;
const sectorGlow = new Float32Array(8);
const isMenu = m => m === 'title' || m === 'help' || m === 'code' || m === 'music' || m === 'about' || m === 'settings';
const layTarget = () => isMenu(G.mode) || (isLand && (G.mode === 'over' || G.mode === 'share')) ? LAY.title : LAY.play;

function resize() {
  W = innerWidth; H = innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  // Paysage (tablette, ordinateur, téléphone couché) : l'arène prend toute la hauteur, l'interface passe sur les côtés.
  isLand = W > H * 1.15;
  document.documentElement.classList.toggle('land', isLand);
  const st = parseFloat(getComputedStyle($('hud')).paddingTop) || 10;
  const top = isLand ? st + 4 : st + 74, avail = Math.max(140, H - top - (isLand ? 40 : 64));
  LAY.play.R = Math.max(60, Math.min(W * 0.44, avail * (isLand ? 0.49 : 0.47)));
  LAY.play.CX = W / 2; LAY.play.CY = top + avail / 2;
  measureTitle();
  const L = layTarget(); R = L.R; CX = L.CX; CY = L.CY;
  buildBg();
}
// À rappeler quand les textes du titre changent : leur place décide de celle laissée à l'arène.
// Paysage : si le menu est plus haut que l'écran (petite tablette, zoom d'écran agrandi),
// il rapetisse juste ce qu'il faut au lieu de défiler.
function fitTitle() {
  const t = $('title'), parts = t.querySelectorAll('.top, .bottom'), lg = t.querySelector('.logo');
  parts.forEach(p => { p.style.zoom = ''; });
  lg.style.fontSize = ''; // le logo ne déborde jamais sur les côtés (texte agrandi dans un navigateur)
  if (lg.scrollWidth > lg.clientWidth + 1) lg.style.fontSize = Math.max(16, Math.floor(parseFloat(getComputedStyle(lg).fontSize) * lg.clientWidth / lg.scrollWidth * 0.97)) + 'px';
  if (!isLand) return;
  let z = 1;
  for (let i = 0; i < 4 && t.scrollHeight > t.clientHeight + 1 && z > 0.55; i++) {
    z = Math.max(0.55, z * (t.clientHeight / t.scrollHeight) * 0.98);
    parts.forEach(p => { p.style.zoom = z.toFixed(3); });
  }
}
function measureTitle() {
  fitTitle();
  const tr = document.querySelector('#title .top').getBoundingClientRect();
  const br = document.querySelector('#title .bottom').getBoundingClientRect();
  LAY.title.back = false;
  if (isLand) { // menu à droite, arène à gauche
    const areaW = Math.max(220, br.left - 16);
    LAY.title.R = Math.max(60, Math.min(areaW * 0.42, H * 0.4)); LAY.title.CX = areaW / 2 + 8; LAY.title.CY = H / 2;
    return;
  }
  const top = tr.bottom + 28, avail = br.top - 30 - top;
  LAY.title.CX = W / 2;
  if (avail < 116) { LAY.title.R = LAY.play.R; LAY.title.CY = LAY.play.CY; LAY.title.back = true; }
  else { LAY.title.R = Math.min(W * 0.45, avail * 0.46); LAY.title.CY = top + avail / 2; }
}
function layoutStep(dt) {
  const L = layTarget(), f = 1 - Math.exp(-dt * 6);
  R += (L.R - R) * f; CX += (L.CX - CX) * f; CY += (L.CY - CY) * f;
}

function buildBg() {
  bgCan = document.createElement('canvas'); bgCan.width = cvs.width; bgCan.height = cvs.height;
  const b = bgCan.getContext('2d'), cy = LAY.play.CY;
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  b.fillStyle = theme.bg; b.fillRect(0, 0, W, H);
  const g = b.createRadialGradient(W / 2, cy, 10, W / 2, cy, Math.max(W, H) * 0.75);
  g.addColorStop(0, hexA(theme.deep, 0.95)); g.addColorStop(0.45, hexA(theme.deep, 0.32)); g.addColorStop(1, hexA(theme.bg, 0));
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const r = mulberry32(7);

    }
    const px = X(P.x), py = Y(P.y), gs = pr * 8;
    c.globalAlpha = 0.9; c.drawImage(glow(pcol), px - gs / 2, py - gs / 2, gs, gs);
    c.globalAlpha = 1; c.fillStyle = pfill; c.beginPath(); c.arc(px, py, pr, 0, TAU); c.fill();
    // Anneau tournant : c'est toi, pas un écho. À l'envers, il tourne dans l'autre sens.
    c.strokeStyle = flip ? theme.star : prism ? PRISM[G.prism] : theme.player; c.lineWidth = 1.2; c.globalAlpha = 0.7;
    c.setLineDash([pr * 0.9, pr * 0.7]); c.lineDashOffset = (flip ? 1 : -1) * realTime * 30;

      for (const sgn of [1, -1]) {
        const ax = px + sgn * pr * 2.7;
        c.beginPath(); c.moveTo(ax - sgn * pr * 0.5, py - pr * 0.45); c.lineTo(ax + sgn * pr * 0.3, py); c.lineTo(ax - sgn * pr * 0.5, py + pr * 0.45); c.stroke();
      }
      c.globalAlpha = 1;
    }
  }

  // Première partie : on nomme les choses.
  if (G.tutoStep < 99 && G.mode === 'play') {
    c.globalCompositeOperation = 'source-over';
    c.font = '600 12px ' + FONT_UI; c.textAlign = 'center'; c.textBaseline = 'middle';
    if (G.time < 4.5 && G.P.alive) tag(c, T('you'), X(G.P.x), Y(G.P.y) - PLAYER_R * R * 2 - 14, theme.player, G.time / 4.5);
    const fe = G.firstEcho;
    if (fe && fe.fade === 0 && G.time - G.firstEchoT < 5) tag(c, T('yourEcho'), RX(fe.bx, fe.by), RY(fe.bx, fe.by) - br - 16, fe.color, (G.time - G.firstEchoT) / 5);
    c.globalCompositeOperation = 'lighter';
  }

  for (const p of parts) {
    c.globalAlpha = 1 - p.life / p.max; c.fillStyle = p.color;
    c.fillRect(X(p.x) - p.size / 2, Y(p.y) - p.size / 2, p.size, p.size);
  }

  c.globalCompositeOperation = 'source-over';
  if (theme.id === 'noel') drawSnow(c, G.mode === 'pause' ? 0 : frameDt);
  // Écran trop court pour loger l'arène entre les boutons du menu : elle passe en toile de fond, assombrie.
  backA += ((title && LAY.title.back ? 0.66 : 0) - backA) * 0.1;
  if (backA > 0.01) { c.globalAlpha = backA; c.fillStyle = theme.bg; c.fillRect(0, 0, W, H); }
  if (G.mode === 'over' || G.mode === 'share' || G.mode === 'dying') { c.globalAlpha = G.mode === 'dying' ? Math.min(0.28, G.deathT * 0.3) : G.mode === 'share' ? 0.5 : 0.28; c.fillStyle = theme.bg; c.fillRect(0, 0, W, H); }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const f of floats) {
    const t = f.life / f.max;
    c.globalAlpha = 1 - t * t; c.fillStyle = f.color; c.font = '600 ' + f.px + 'px ' + FONT_UI;
    c.fillText(f.text, X(f.x), Y(f.y) - t * 26);
  }
  if (flashA > 0) { c.globalAlpha = flashA; c.fillStyle = flashC; c.fillRect(0, 0, W, H); }
  c.globalAlpha = 1;
}

function spaced(c, text, x, y, sp) {
  const chars = Array.from(text), ws = chars.map(ch => c.measureText(ch).width);
  let px = x - (ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1)) / 2;
  c.textAlign = 'left';
  chars.forEach((ch, i) => { c.fillText(ch, px, y); px += ws[i] + sp; });
  c.textAlign = 'center';
}
function modeLine() {

// Image 1080 × 1350 : tous les chemins de la partie forment ta constellation.
function makeShareImage() {
  const Wc = 1080, Hc = 1350, cv = document.createElement('canvas');
  cv.width = Wc; cv.height = Hc;
  const c = cv.getContext('2d'), cx = Wc / 2, cy = 640, Rr = 420;
  c.fillStyle = theme.bg; c.fillRect(0, 0, Wc, Hc);
  const g = c.createRadialGradient(cx, cy, 20, cx, cy, 820);
  g.addColorStop(0, hexA(theme.deep, 1)); g.addColorStop(0.5, hexA(theme.deep, 0.35)); g.addColorStop(1, hexA(theme.bg, 0));
  c.fillStyle = g; c.fillRect(0, 0, Wc, Hc);
  const r = mulberry32(G.seed + 1);
  c.fillStyle = '#dce6ff';
  for (let i = 0; i < 220; i++) { c.globalAlpha = 0.1 + r() * 0.45; const s = 1 + r() * 2.2; c.fillRect(r() * Wc, r() * Hc, s, s); }
  c.strokeStyle = theme.ring; c.globalAlpha = 0.35; c.lineWidth = 3;
  c.beginPath(); c.arc(cx, cy, Rr, 0, TAU); c.stroke();
  c.globalAlpha = 0.14; c.setLineDash([4, 14]); c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, Rr * INNER, 0, TAU); c.stroke(); c.setLineDash([]);
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const p of G.runPaths) {
    c.strokeStyle = p.color;
    c.beginPath(); c.moveTo(cx + p.xs[0] * Rr, cy + p.ys[0] * Rr);
    for (let k = 1; k < p.n; k++) {
      const x = cx + p.xs[k] * Rr, y = cy + p.ys[k] * Rr;
      if (isJump(p.xs[k - 1], p.ys[k - 1], p.xs[k], p.ys[k])) c.moveTo(x, y); // saut de portail : on lève le crayon
      else if (k % 2 === 0 || k === p.n - 1) c.lineTo(x, y);
    }
    c.globalAlpha = 0.09; c.lineWidth = 18; c.stroke();
    c.globalAlpha = 0.8; c.lineWidth = 3.2; c.stroke();
    const ex = cx + p.xs[p.n - 1] * Rr, ey = cy + p.ys[p.n - 1] * Rr;
    c.globalAlpha = 0.9; c.drawImage(glow(p.color), ex - 26, ey - 26, 52, 52);
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.textBaseline = 'middle'; c.textAlign = 'center';
  c.fillStyle = '#eef0ff'; c.font = '300 64px ' + FONT_DISPLAY;
  spaced(c, 'LUMÉCHO', cx, 110, 20);
  c.fillStyle = theme.ring; c.globalAlpha = 0.85; c.font = '500 28px ' + FONT_UI;
  spaced(c, modeLine().toLocaleUpperCase(LOC), cx, 172, 4);
  c.globalAlpha = 1; c.fillStyle = '#eef0ff'; c.font = '200 128px ' + FONT_NUM;
  c.fillText(N(G.score), cx, 1108);
  c.fillStyle = theme.star; c.font = '600 34px ' + FONT_UI;
  spaced(c, rankOf(G.score).toLocaleUpperCase(LOC), cx, 1186, 8);
  c.fillStyle = '#8b91bd'; c.font = '400 30px ' + FONT_UI;
  c.fillText(T('shStats', G.stars, G.cycle, G.maxCombo), cx, 1234);
  c.fillStyle = theme.star; c.globalAlpha = 0.85; c.font = 'italic 400 28px ' + FONT_UI;
  c.fillText('♪ ' + (G.songsDone.length ? T('shDone', songTitle(G.songsDone[0])) : songTitle(G.song)), cx, 1276);
  c.globalAlpha = 0.6; c.fillStyle = '#8b91bd'; c.font = '500 22px ' + FONT_UI;
  spaced(c, 'COSMOPIXELGAMES', cx, 1316, 8);
  c.globalAlpha = 1;
  return cv;
}

// Texte à coller n'importe où : ✦ étoile, ◎ oubli, ✕ fin de partie.
function shareText() {
  const lines = [G.daily ? 'LUMÉCHO · ' + T('shDaily', dayLabel()) + ' (' + T('m_' + G.mod.id) + ')' : 'LUMÉCHO · ' + wName(G.world)];

}

function openShare() {
  const cv = makeShareImage(); shareCv = cv;

  $('shareMsg').textContent = '';

  $('shareHint').hidden = nativeShare();
  shareBlob = null;
  if (shareURL) { URL.revokeObjectURL(shareURL); shareURL = ''; }
  try {
    cv.toBlob(b => { if (!b) return; shareBlob = b; shareURL = URL.createObjectURL(b); $('shareImg').src = shareURL; }, 'image/png');
  } catch (e) { $('shareImg').src = cv.toDataURL('image/png'); }

}
async function doShare() {
  const text = $('shareTxt').textContent;
  if (nativeShare() && shareCv) {
    try {
      const data = shareCv.toDataURL('image/png').split(',')[1];
      const f = await capPlugin('Filesystem').writeFile({ path: 'lumecho.png', data, directory: 'CACHE' });
      await capPlugin('Share').share({ title: 'Lumécho', text, files: [f.uri], dialogTitle: T('share') });
      return;
    } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return; }
  }
  try {
    if (shareBlob) {
      const file = new File([shareBlob], 'lumecho.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    }
    if (navigator.share) { await navigator.share({ text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  copyText();
}
function copyText() {

}

      const sp = document.createElement('span'), b = document.createElement('b'), sm = document.createElement('small'), em = document.createElement('em');
      b.textContent = songTitle(s); sm.textContent = songBy(s) + ' · ' + T('notes', s.notes.length);
      em.textContent = done ? T('zenPlay') : go ? T('play') + ' ▸' : DEMO ? T('inFull') : w.event ? T(w.id === 'noel' ? 'atXmas' : 'atHw') : T('soon');
      sp.append(b, sm); row.append(sp, em);
      if (done) row.addEventListener('click', () => play('zen', { world: i, song: id }));
      else if (go) row.addEventListener('click', () => { wIndex = thView = i; store.world = w.id; saveStore(); play('classic', { world: i, song: id }); });
      box.appendChild(row);
    }
  });
  $('musicCount').textContent = T('mCount', SONGS.filter(s => store.done[s.id]).length, SONGS.length);
  setMode('music');
}

/* ---------- Réglages ---------- */
function openSettings() { auInit(); buildLangs(); $('saveMsg').textContent = T('saveHint'); setMode('settings'); }

/* ---------- Sauvegarde : exporter / importer un fichier .json ----------
   La progression s'enregistre déjà toute seule sur l'appareil. L'export en fait une copie que le joueur
   range où il veut (Drive, e-mail…) : utile pour passer de la version de test à celle du Play Store,
   ou d'un téléphone à l'autre. Rien n'est envoyé ailleurs que là où il choisit. */
const saveName = () => 'lumecho-' + (LANG === 'fr' ? 'sauvegarde' : 'save') + '-' + dateKey() + '.json';
async function exportSave() {
  const msg = $('saveMsg'), name = saveName();
  const data = JSON.stringify({ jeu: 'Lumécho', format: 1, build: window.LUMECHO_BUILD || 'dev', date: new Date().toISOString(), progression: store });
  if (nativeShare()) {
    try {
      const f = await capPlugin('Filesystem').writeFile({ path: name, data, directory: 'CACHE', encoding: 'utf8' });
      await capPlugin('Share').share({ title: T('expTitle'), files: [f.uri], dialogTitle: T('exp') });
      msg.textContent = T('expOk');
    } catch (e) { if (!/cancel/i.test(String((e && e.message) || e))) msg.textContent = T('expNo'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    msg.textContent = T('expWeb');
  } catch (e) { msg.textContent = T('expNo'); }
}
function importSave() { const f = $('importFile'); f.value = ''; f.click(); }
async function readImport() {
  const file = $('importFile').files[0], msg = $('saveMsg');
  if (!file) return;
  let o = null;
  try { o = JSON.parse(await file.text()); } catch (e) { o = null; }
  const p = o && (o.jeu === 'Lumécho' || o.jeu === 'Rémanence') && o.progression; // « Rémanence » : fichiers de la version de test d'avant le changement de nom
  if (!p || typeof p !== 'object' || typeof p.done !== 'object' || !p.done) { msg.textContent = T('impBad'); return; }
  if (!window.confirm(T('impAsk'))) return;
  // Les réglages de cet appareil (langue, son, vibrations) restent ; tout le reste vient du fichier.
  const merged = Object.assign({}, p, { lang: store.lang, sound: store.sound, haptic: store.haptic });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(merged)); } catch (e) { msg.textContent = T('expNo'); return; }
  msg.textContent = T('impOk');
  setTimeout(() => location.reload(), 800);
}

/* ---------- Code ami ---------- */
function openCode() {
  auInit();
  $('codeIn').value = '';
  checkCode();
  setMode('code');
  setTimeout(() => { try { $('codeIn').focus(); } catch (e) { /* ignoré */ } }, 350);
}
function checkCode() {
  const v = $('codeIn').value, p = parseCode(v), msg = $('codeMsg');
  $('btnCodeGo').disabled = !p;
  if (p && v.trim().toUpperCase() !== p.code) $('codeIn').value = p.code; // message collé : on ne garde que le code
  if (!v.trim()) msg.textContent = T('fHelp');
  else if (!p) msg.textContent = T('fBad');
  else if (DEMO && (p.seed & WMASK) !== 0) { msg.textContent = T('demoFriend', wName(WORLDS[p.seed & WMASK] || WORLDS[0])); $('btnCodeGo').disabled = true; return null; }
  else msg.textContent = T('fOk', wName(WORLDS[p.seed & WMASK] || WORLDS[0])) + (p.target ? ' · ' + T('fTarget', N(p.target)) : '');
  return p;
}
function playCode() {
  const p = checkCode();
  if (!p) return;
  try { $('codeIn').blur(); } catch (e) { /* ignoré */ }
  play('friend', p);
}

/* ---------- Fin de partie ---------- */
function showOver(rec, newly, line, friend) {
  clearTimeout(bannerT); $('banner').classList.remove('show'); // un bandeau de début de partie ne doit pas rester sous la carte
  $('oKick').textContent = G.daily ? T('daily') + ' · ' + T('m_' + G.mod.id) : G.kind === 'friend' ? T('fTitle') + ' · ' + wName(G.world) : wName(G.world);
  $('oScore').textContent = N(G.score);
  $('oRank').textContent = rankOf(G.score);
  $('oRec').hidden = !rec;
  const of = $('oFriend');
  of.hidden = !friend;
  if (friend) of.textContent = friend.won ? T('fWon') : T('fLeft', N(friend.target - G.score + 5));
  $('oQuote').textContent = line;
  $('oSong').textContent = (G.songsDone.length ? T('songDoneL', G.songsDone.map(songTitle).join(', ')) : T('songProg', songTitle(G.song), G.noteIdx, G.song.notes.length))
    + (G.rhythm ? ' · ' + T('inRhy', G.rhythm) : '');
  $('oStars').textContent = G.stars; $('oCycle').textContent = G.cycle;
  $('oNear').textContent = G.near; $('oCombo').textContent = '×' + G.maxCombo;
  $('oBest').textContent = G.daily
    ? T('bestDay', N(store.daily.best)) + (store.streak.count > 1 ? ' · ' + T('streakD', store.streak.count) : '')
    : T('bestW', wName(G.world), N(wstat(G.world.id).best));
  const ni = WORLDS.findIndex((w, i) => !w.event && !unlocked(i)), bar = $('oBar'), pt = $('oProgT');
  bar.style.transition = 'none'; bar.style.width = '0%';
  let target = 100;
  bar.parentElement.hidden = DEMO; $('btnOverFull').hidden = !DEMO;
  if (DEMO) pt.textContent = T('demoMore');
  else if (newly.length) pt.textContent = T('newW', newly.map(wName).join(', '));
  else if (ni > 0) {
    const p = WORLDS[ni - 1], mc = wstat(p.id).maxCycle;
    pt.textContent = T('nextW2', wName(WORLDS[ni]), wName(p), mc, store.lifeStars, WORLDS[ni].need);
    target = clamp(Math.max(mc / 3, store.lifeStars / WORLDS[ni].need), 0, 1) * 100;
  } else pt.textContent = T('allW');
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = ''; bar.style.width = target + '%'; }));
  if (rec || newly.length || (friend && friend.won)) {
    for (let i = 0; i < 6; i++) { const a = Math.random() * TAU; burst(Math.cos(a) * 0.5, Math.sin(a) * 0.5, i % 2 ? theme.star : theme.ring, 18, 0.9); }
    sfxSongDone();
  }
}

/* ---------- Pause ---------- */
function pauseGame() {
  if (G.mode !== 'play') return;
  $('btnQuit').textContent = G.zen ? T('end') : T('quit');
  setMode('pause'); $('pScore').textContent = N(G.score);
  if (AU.ctx) AU.ctx.suspend().catch(() => {});
}
function resumeGame() {
  if (G.mode !== 'pause') return;
  auInit(); setMode('play'); acc = 0;
}

/* ---------- Contrôles : glisser n'importe où (déplacement relatif) ---------- */
cvs.addEventListener('pointerdown', e => {
  auInit();
  if (G.mode !== 'play' || pointerId !== null) return;
  pointerId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  try { cvs.setPointerCapture(e.pointerId); } catch (err) { /* ignoré */ }
  e.preventDefault();
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerId !== pointerId || G.mode !== 'play') return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  // Sensibilité indépendante de la taille d'écran : traverser l'arène demande le même geste partout.
  // Envers : le geste part dans l'autre sens (haut devient bas, gauche devient droite).
  const s = SENS / Math.min(R, 190) * (rule('envers') ? -1 : 1);
  G.pending.x += dx * s; G.pending.y += dy * s;
  const L = hyp(G.pending.x, G.pending.y);
  if (L > PENDING_CAP) { G.pending.x *= PENDING_CAP / L; G.pending.y *= PENDING_CAP / L; }
  e.preventDefault();
});
const endPtr = e => { if (e.pointerId === pointerId) pointerId = null; };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cvs.addEventListener(n, endPtr));
addEventListener('pointerdown', () => auInit(), { passive: true });
addEventListener('contextmenu', e => { if (e.target.id !== 'shareImg' && e.target.id !== 'shareTxt' && e.target.id !== 'codeIn') e.preventDefault(); });

// Clavier : flèches, ZQSD (AZERTY) ou WASD.
const KEYMAP = { ArrowLeft: 'l', KeyA: 'l', KeyQ: 'l', ArrowRight: 'r', KeyD: 'r', ArrowUp: 'u', KeyW: 'u', KeyZ: 'u', ArrowDown: 'd', KeyS: 'd' };
addEventListener('keydown', e => {
  if (G.mode === 'code') { if (e.code === 'Enter') playCode(); else if (e.code === 'Escape') toTitle(); return; }
  const k = KEYMAP[e.code];
  if (k && G.mode === 'play') { keys.add(k); e.preventDefault(); }
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (G.mode === 'play') pauseGame(); else if (G.mode === 'pause') resumeGame();
    else if (G.mode === 'help') closeHelp(); else if (G.mode === 'share') setMode('over');
    else if (G.mode === 'music' || G.mode === 'about' || G.mode === 'settings') setMode('title');
  }
  if (e.code === 'KeyR' && G.mode === 'over') retry();
  if (e.code === 'KeyF' && fsOK && G.mode !== 'code') toggleFs();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
// Appli cachée (autre appli, écran éteint) : la partie se met en pause et le son se coupe ; il revient au retour.
function onHidden() { if (G.mode === 'play') pauseGame(); else if (AU.ctx) AU.ctx.suspend().catch(() => {}); }
function onShown() { if (G.mode !== 'pause' && AU.ctx) AU.ctx.resume().catch(() => {}); }
document.addEventListener('visibilitychange', () => { if (document.hidden) onHidden(); else onShown(); });

/* ---------- Bouton Retour (Android) ----------
   Retour revient à l'écran précédent ; en partie, il met en pause.
   Sur l'écran titre, il faut appuyer deux fois pour quitter.
   Navigateur : une entrée d'historique « garde » intercepte le retour.
   Appli Capacitor : écouteur backButton du plugin @capacitor/app. */
function guard() { try { history.pushState({ rm: 1 }, ''); } catch (e) { /* ignoré */ } }
function goBack(native) {
  const m = G.mode;
  if (m === 'title') {
    if (exitArmed && native) { capApp.exitApp(); return; }
    exitArmed = true; toast(T('exit'));
    clearTimeout(exitT); exitT = setTimeout(() => { exitArmed = false; if (!native) guard(); }, 2500);
    return; // navigateur : pas de nouvelle garde, le prochain retour quitte la page
  }
  if (m === 'play') pauseGame();
  else if (m === 'pause') resumeGame();
  else if (m === 'help') { helpThen = null; setMode('title'); }
  else if (m === 'music' || m === 'about' || m === 'settings') setMode('title');
  else if (m === 'code' || m === 'over') toTitle();
  else if (m === 'share') setMode('over');
  if (!native) guard();
}
if (capApp) { capApp.addListener('backButton', () => goBack(true)); capApp.addListener('appStateChange', st => { if (st && st.isActive) onShown(); else onHidden(); }); }
else { try { history.replaceState({ rm: 0 }, ''); } catch (e) { /* ignoré */ } guard(); addEventListener('popstate', () => goBack(false)); }

// Rejouer : un morceau choisi dans la Musicothèque reste la cible tant qu'il n'est pas gagné.
function retry() {
  startGame(G.kind, G.kind === 'friend' ? { seed: G.seed, target: G.target, code: G.friendCode }
    : G.kind === 'classic' && G.pick && !store.done[G.pick] ? { song: G.pick } : null);
}
const on = (id, fn) => $(id).addEventListener('click', fn);
const openStore = () => { try { window.open(PLAY_URL, '_blank', 'noopener'); } catch (e) { location.href = PLAY_URL; } };
on('btnPlay', () => { if (DEMO && !unlocked(thView)) openStore(); else play('classic'); });
on('btnOverFull', openStore);
on('btnZen', () => play('zen'));
on('btnDaily', () => play('daily'));
on('btnHelp', () => openHelp(null));
on('btnHelpGo', closeHelp);
on('btnMusic', openMusic);
on('btnMusicClose', () => setMode('title'));
on('btnSettings', openSettings);
on('btnSetClose', () => setMode('title'));
on('btnExport', () => { sfxUi(); exportSave(); });
on('btnImport', () => { sfxUi(); importSave(); });
$('importFile').addEventListener('change', readImport);
if (window.LUMECHO_ARTIFACT) $('saveBox').style.display = 'none'; // l'aperçu ne peut pas enregistrer de fichier
on('btnFs', toggleFs);
on('btnAbout', () => {
  $('credits').textContent = SONGS.map(s => songTitle(s) + ' (' + songBy(s) + ')').join(' · ') + '. ' + T('credits');
  setMode('about');
});
on('btnAboutClose', () => setMode('title'));
on('btnCode', openCode);
on('btnCodeGo', playCode);
on('btnCodeBack', toTitle);
$('codeIn').addEventListener('input', checkCode);
on('btnRetry', retry);
on('btnMenu', toTitle);
on('btnShare', openShare);
on('btnShareGo', doShare);
on('btnShareCopy', copyText);
on('btnShareClose', () => setMode('over'));
on('btnResume', resumeGame);
on('btnQuit', () => { auInit(); if (G.zen) { toTitle(); return; } G.quit = true; gameOver(); });
on('pauseBtn', pauseGame);
on('thPrev', () => { auInit(); thView = (thView + WORLDS.length - 1) % WORLDS.length; showWorldView(true); });
on('thNext', () => { auInit(); thView = (thView + 1) % WORLDS.length; showWorldView(true); });
on('tgSound', () => { auInit(); setSound(!store.sound); refreshTitle(); sfxUi(); });
on('tgHaptic', () => { store.haptic = !store.haptic; saveStore(); refreshTitle(); buzz(15); });

/* ---------- Boucle principale (pas fixe + rendu libre) ---------- */
let lastT = 0, acc = 0, shownInt = -1;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.1) dt = 0.1;
  realTime += dt; frameDt = dt;
  if (G.hitstop > 0) G.hitstop -= dt;
  else if (G.mode !== 'pause') {
    acc += dt;
    let steps = 0;
    while (acc >= TICK && steps < 8) {
      if (G.mode === 'play') tickPlay();
      else if (G.mode === 'dying') tickDying();
      else if (G.mode === 'over' || G.mode === 'share') tickAmbient(echoMul() * 0.45);
      else tickAmbient(0.8);
      acc -= TICK; steps++;
      if (G.hitstop > 0) break;
    }
    if (steps >= 8) acc = 0;
  }
  updateFx(G.mode === 'pause' ? 0 : dt);
  if (G.mode === 'play' || G.mode === 'dying') {
    if (shownScore !== G.score) {
      shownScore += (G.score - shownScore) * Math.min(1, dt * 12);
      if (Math.abs(G.score - shownScore) < 0.5) shownScore = G.score;
    }
    const s = Math.round(shownScore);
    if (s !== shownInt) { $('score').textContent = s; shownInt = s; }
  }
  musicTick();
  layoutStep(dt);
  render();
}

function init() {
  $('aboutVer').textContent = 'Lumécho · ' + VERSION;
  if (DEMO) { $('demoLink').hidden = false; $('demoLink').href = PLAY_URL; $('aboutPrivacy').dataset.t = 'privacyWeb'; }
  useLang(detectLang());
  applyLang();
  applyThemeCSS();
  G.world = theme;
  refreshTitle();
  resize();
  addEventListener('resize', resize);
  attract();
  setMode('title');
  requestAnimationFrame(t => { lastT = t; frame(t); });
}
init();
</script>
